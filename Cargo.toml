[package]
name = "lazy-dev-line-bot-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.28", features = ["full"] }
axum = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.4", features = ["cors"] }
dotenv = "0.15"
reqwest = { version = "0.11", features = ["json"] }